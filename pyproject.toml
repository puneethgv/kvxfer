[project]
name = "kvxfer"
version = "0.1.0"
description = "Attention-aligned KV cache transfer between models in a family"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.51",
    "datasets>=2.20",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.5"]
plot = ["matplotlib>=3.8", "pandas>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kvxfer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: requires loading real model weights",
]
